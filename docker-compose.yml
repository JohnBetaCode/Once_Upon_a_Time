services:
  app:
    build: .
    container_name: once-upon-a-time
    ports:
      - "8501:8501"
    volumes:
      # Live-reload the code while developing
      - ./app:/workspace/app
      # Persist projects (characters, locations, images) on the host
      - ./projects:/workspace/projects
      # Usage/cost accounting log
      - ./data:/workspace/data
      # Secrets and prompt templates
      - ./config:/workspace/config
      # Google Application Default Credentials from the host
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
    restart: unless-stopped

  # Local image generation on the GPU (proof of concept). Opt-in: it only starts with
  #   docker compose --profile local-image up -d local-image
  # The first start downloads ~33 GB of weights into the local-image-models volume.
  local-image:
    build: ./local_image
    container_name: once-upon-a-time-local-image
    profiles: ["local-image"]
    ports:
      # Loopback only: the server has no authentication. The app reaches it through
      # the compose network at http://local-image:8000.
      - "127.0.0.1:8600:8000"
    volumes:
      - local-image-models:/models
    environment:
      - LOCAL_IMAGE_MODEL=${LOCAL_IMAGE_MODEL:-Qwen/Qwen-Image-2.1}
      - LOCAL_IMAGE_STEPS=${LOCAL_IMAGE_STEPS:-40}
      - LOCAL_IMAGE_SIZE=${LOCAL_IMAGE_SIZE:-1k}
      - LOCAL_IMAGE_CFG=${LOCAL_IMAGE_CFG:-1.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  local-image-models:
